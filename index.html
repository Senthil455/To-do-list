<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my todo list</title>
  <link rel="stylesheet" href="style.css">
  <!-- TODO: add favicon later -->
</head>
<body>

  <header>
    <div class="container">
      <h1 id="logo">tasks</h1>
    </div>
  </header>

  <main class="container">

    <!-- add new task -->
    <div class="add-task">
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="what needs to be done?" autofocus>
        <button type="submit" id="add-btn">+ Add</button>
      </form>
    </div>

    <!-- filter buttons -->
    <div class="filters">
      <button class="filter-btn active" data-view="all">All</button>
      <button class="filter-btn" data-view="active">Active</button>
      <button class="filter-btn" data-view="done">Done</button>
    </div>

    <!-- counter -->
    <p id="counter">0 left</p>

    <!-- the list -->
    <ul id="list"></ul>

  </main>

  <footer>
    <p>just a todo app &mdash; 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
